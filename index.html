<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CIAAR Tunes - Canções Militares - EAOF 2026</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">
    <meta name="theme-color" content="#0B132B">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- YouTube IFrame API -->
    <script src="https://www.youtube.com/iframe_api"></script>
</head>

<body>
    <div class="app-container">
        <header class="glass-header">
            <div class="header-content">
                <h1>CIAAR Tunes - EAOF 2026</h1>
                <p>Domine as canções militares e tenha noites tranquilas.</p>
            </div>
            <div class="overall-stats">
                <div class="stat-box">
                    <i class="fa-solid fa-clock"></i>
                    <span id="total-hours">0h 0m</span>
                </div>
                <div class="stat-box">
                    <i class="fa-solid fa-play"></i>
                    <span id="total-views">0</span>
                </div>
            </div>
        </header>

        <main id="dashboard" class="view active">
            <div class="filters">
                <button class="filter-btn active" data-sort="default">Padrão</button>
                <button class="filter-btn" data-sort="level">Focar (Menor Nível)</button>
                <button class="filter-btn" data-sort="views">Mais Vistos</button>
            </div>
            <div id="songs-list" class="songs-grid">
                <!-- Injected via JS -->
            </div>
        </main>

        <main id="player-view" class="view hidden">
            <button id="back-btn" class="glass-btn"><i class="fa-solid fa-arrow-left"></i> Voltar</button>
            <div class="player-container glass-card">
                <h2 id="current-title">Título</h2>
                <div class="video-wrapper">
                    <div id="yt-player"></div>
                </div>
                <div class="player-stats">
                    <p><i class="fa-solid fa-clock"></i> Tempo assistido: <span id="current-time">0m 0s</span></p>
                    <p><i class="fa-solid fa-play"></i> Visualizações: <span id="current-views">0</span></p>
                </div>
                <div class="rating-section">
                    <h3>Nível de Aprendizado</h3>
                    <div class="stars" id="star-rating">
                        <i class="fa-solid fa-star" data-val="1"></i>
                        <i class="fa-solid fa-star" data-val="2"></i>
                        <i class="fa-solid fa-star" data-val="3"></i>
                        <i class="fa-solid fa-star" data-val="4"></i>
                        <i class="fa-solid fa-star" data-val="5"></i>
                    </div>
                    <p id="rating-text">Selecione o nível</p>
                </div>
                <div class="lyrics-section">
                    <h3>Letra da Canção</h3>
                    <div id="current-lyrics" class="lyrics-content">
                        <!-- Lyrics will be injected here -->
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script type="module" src="app.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').then(reg => {
                    console.log('SW registrado com sucesso!');
                }).catch(err => console.log('Erro no SW', err));
            });
        }
    </script>
</body>

</html>
